# maestro.example.yaml: copiar a maestro.yaml y ajustar.
#
# Los servicios de Docker se descubren solos; acá van solo los hosts con
# agent, lo que no es Docker y lo que se quiera pisar de un servicio
# descubierto. Los secretos van en variables de entorno (${NOMBRE}), nunca
# escritos en este archivo: una variable que falta es un error al arrancar.
# Una clave desconocida también es un error. Dentro de un mapa entre llaves
# ({ ... }) la variable va entre comillas: token: "${MAESTRO_TOKEN_VM}".

# Token para pedir la API sin sesión, por ejemplo el informe para IA con
#   curl -H "Authorization: Bearer $MAESTRO_API_TOKEN" https://<maestro>/api/services/<id>/report
# Opcional; mínimo 32 caracteres (openssl rand -hex 32).
api_token: ${MAESTRO_API_TOKEN}

# Avisos a Telegram cuando un servicio se cae y cuando vuelve. Opcional.
# token es el de BotFather; chat, uno o más chat_id separados por espacios
# o comas (negativos en grupos y canales). Los dos son secretos.
telegram:
  token: ${MAESTRO_TELEGRAM_TOKEN}
  chat: ${MAESTRO_TELEGRAM_CHAT}

# Dirección del hub desde afuera, para el link "Ver en Maestro" de los
# avisos. Opcional.
public_url: https://maestro.example.org

hosts:
  vm:
    agent: http://192.168.0.11:9101
    token: ${MAESTRO_TOKEN_VM}
  adguard:
    agent: http://192.168.0.12:9101
    token: ${MAESTRO_TOKEN_ADGUARD}

services:
  # Clave sin "/": un servicio propio. Con unit es una unidad systemd leída
  # por el agent de host; sin unit, un servicio externo (solo checks).
  adguard:
    name: AdGuard Home
    group: Red
    icon: adguard-home # logo de dashboard-icons; sin icon, el hub lo adivina
    url: https://adguard.example.org
    host: adguard
    unit: AdGuardHome.service
    check:
      http: http://192.168.0.12/
      expect: 200      # sin expect vale cualquier 2xx
      tcp: 192.168.0.12:53
      interval: 60s    # por defecto 60s
      timeout: 10s     # por defecto 10s

  router:
    name: Router
    group: Red
    check: { http: https://192.168.0.1/, redirects: false }

  # Check push: el script llama a https://<maestro>/push/<token> (GET o
  # POST) cada vez que termina bien. Si la llamada no llega en interval
  # (más una gracia de un 10 %), el servicio cae. El token es un secreto:
  # openssl rand -hex 16.
  restic:
    name: Backups
    group: Sistema
    check:
      push: ${MAESTRO_PUSH_RESTIC}
      interval: 96h

  # Clave "<proyecto>/<servicio>" de compose: pisa valores del servicio
  # descubierto, por encima de sus labels maestro.* y homepage.*.
  frigate/frigate:
    alert: false # se apaga solo cuando no está la cámara

  beszel/beszel-agent:
    ignore: true

  immich/redis:
    hidden: true # no se muestra en la portada, pero se sigue vigilando

# Lo que sigue también se hace desde la interfaz (modo edición de la
# portada) y se exporta con "Exportar a maestro.yaml". Lo que se declara
# acá ya no se cambia desde la interfaz.

# Tarjeta de un stack de compose: clave "<host>/<proyecto>".
stacks:
  vm/immich:
    name: Fotos
    group: Archivos
  # vm/juguete: { hidden: true }

# Orden de los grupos de la portada. Los que no están van después, por
# nombre, y "Otros" (las tarjetas sin grupo) siempre al final.
groups: [Archivos, Media, Red, Sistema]
