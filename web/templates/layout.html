{{define "layout"}}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Maestro</title>
  <link rel="stylesheet" href="/static/beercss-5.0.3/beer.min.css">
  <link rel="stylesheet" href="/static/maestro.css">
  <script type="module" src="/static/beercss-5.0.3/beer.min.js"></script>
  <script src="/static/htmx-2.0.11.min.js" defer></script>
</head>
<body>
  {{/* Barra superior en pantallas medianas y grandes */}}
  <header class="fixed m l topbar">
    <nav>
      <i class="primary-text">hub</i>
      <h6 class="small brand">Maestro</h6>
      <a class="button {{if eq .Active "services"}}secondary-container{{else}}transparent{{end}}" href="/">
        <i>dashboard</i>
        <span>Servicios</span>
      </a>
      <a class="button {{if eq .Active "hardware"}}secondary-container{{else}}transparent{{end}}" href="/hardware">
        <i>memory</i>
        <span>Hardware</span>
      </a>
    </nav>
  </header>

  {{/* Barra de navegación abajo en el celular */}}
  <nav class="bottom s">
    <a href="/"{{if eq .Active "services"}} class="active"{{end}}>
      <i>dashboard</i>
      <span>Servicios</span>
    </a>
    <a href="/hardware"{{if eq .Active "hardware"}} class="active"{{end}}>
      <i>memory</i>
      <span>Hardware</span>
    </a>
  </nav>

  <main class="responsive">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
