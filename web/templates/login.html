{{define "content"}}
<div class="login">
  <article class="small-round no-elevate surface-container-low">
    <nav class="center-align">
      <i class="primary-text extra">hub</i>
    </nav>
    <h5 class="center-align">Maestro</h5>
    {{if .Error}}
    <p class="error-text center-align" role="alert">{{.Error}}</p>
    {{end}}
    {{if .Setup}}
    <p class="center-align secondary-text">Todavía no hay usuarios. Creá el tuyo: es la cuenta del panel, y esta pantalla desaparece apenas exista.</p>
    <form method="post" action="/setup">
      <div class="field label border">
        <input type="text" name="username" id="username" autocomplete="username" required autofocus maxlength="64" value="{{.Username}}">
        <label for="username">Usuario</label>
      </div>
      <div class="field label border">
        <input type="password" name="password" id="password" autocomplete="new-password" required minlength="12">
        <label for="password">Contraseña</label>
        <span class="helper">12 caracteres o más</span>
      </div>
      <div class="field label border">
        <input type="password" name="password2" id="password2" autocomplete="new-password" required minlength="12">
        <label for="password2">Repetila</label>
      </div>
      <nav class="right-align">
        <button type="submit">Crear y entrar</button>
      </nav>
    </form>
    {{else}}
    <form method="post" action="/login">
      <div class="field label border">
        <input type="text" name="username" id="username" autocomplete="username" required autofocus value="{{.Username}}">
        <label for="username">Usuario</label>
      </div>
      <div class="field label border">
        <input type="password" name="password" id="password" autocomplete="current-password" required>
        <label for="password">Contraseña</label>
      </div>
      <nav class="right-align">
        <button type="submit">Entrar</button>
      </nav>
    </form>
    {{end}}
  </article>
</div>
{{end}}
