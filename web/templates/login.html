{{define "content"}}
<div class="login">
  <span class="brand"><span class="brand-mark"><i>hub</i></span><span class="brand-name">Maestro</span></span>
  <article class="login-card no-elevate">
    {{if .Setup}}
    <p class="login-note">Todavía no hay usuarios. Creá el tuyo: es la cuenta del panel, y esta pantalla desaparece apenas exista.</p>
    {{end}}
    {{if .Error}}
    <article class="small-round no-elevate state-reasons down" role="alert">
      <nav>
        <i>error</i>
        <div class="max">{{.Error}}</div>
      </nav>
    </article>
    {{end}}
    {{if .Setup}}
    <form method="post" action="/setup" class="login-form">
      <div class="field label border">
        <input type="text" name="username" id="username" autocomplete="username" required autofocus maxlength="64" value="{{.Username}}">
        <label for="username">Usuario</label>
      </div>
      <div class="field label border">
        <input type="password" name="password" id="password" autocomplete="new-password" required minlength="12">
        <label for="password">Contraseña</label>
        <span class="helper">12 caracteres o más</span>
      </div>
      <div class="field label border">
        <input type="password" name="password2" id="password2" autocomplete="new-password" required minlength="12">
        <label for="password2">Repetila</label>
      </div>
      <button type="submit" class="btn filled"><i>person_add</i>Crear y entrar</button>
    </form>
    {{else}}
    <form method="post" action="/login" class="login-form">
      <div class="field label border">
        <input type="text" name="username" id="username" autocomplete="username" required autofocus value="{{.Username}}">
        <label for="username">Usuario</label>
      </div>
      <div class="field label border">
        <input type="password" name="password" id="password" autocomplete="current-password" required>
        <label for="password">Contraseña</label>
      </div>
      <button type="submit" class="btn filled"><i>login</i>Entrar</button>
    </form>
    {{end}}
  </article>
</div>
{{end}}
